name: setup
description: Sets up development environment
inputs: {}
outputs: {}
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5.0.0
    - uses: actions/setup-node@v6.3.0
      with:
        node-version-file: package.json
        cache: pnpm
    - run: pnpm i --frozen-lockfile
      shell: bash
